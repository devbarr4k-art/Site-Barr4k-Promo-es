<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { width: 320px; margin: 0; padding: 18px; font-family: system-ui, sans-serif; background: #0a0a0a; color: #ededE6; }
      .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
      .logo i { width: 26px; height: 26px; border-radius: 7px; background: #c6ff00; color: #0a0a0a; display: grid; place-items: center; font-size: 15px; }
      p { font-size: 12.5px; color: #a3a39d; line-height: 1.5; margin: 12px 0; }
      label { font-size: 12px; color: #a3a39d; display: block; margin-bottom: 6px; }
      input { width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #2a2a2a; background: #141414; color: #ededE6; font-size: 13px; }
      input:focus { outline: none; border-color: #c6ff00; }
      button { width: 100%; height: 44px; margin-top: 14px; border: 0; border-radius: 999px; background: #c6ff00; color: #0a0a0a; font-weight: 700; font-size: 14px; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .msg { margin-top: 12px; font-size: 12.5px; padding: 10px 12px; border-radius: 10px; display: none; }
      .msg.ok { display: block; background: rgba(198,255,0,.12); color: #c6ff00; }
      .msg.erro { display: block; background: rgba(226,74,63,.14); color: #ff8a80; }
    </style>
  </head>
  <body>
    <div class="logo"><i>✓</i> ACHOU</div>
    <p>Gera os links de afiliado da sua conta do Mercado Livre pro canal, sozinho.</p>
    <label for="token">Token do painel</label>
    <input id="token" type="text" placeholder="Cole aqui o token do painel" autocomplete="off" />
    <button id="conectar">Conectar minha conta</button>
    <div id="msg" class="msg"></div>
    <p style="margin-top:14px">Antes de conectar, entre no Mercado Livre nesta mesma janela do Chrome, com a conta de afiliado.</p>
    <script src="popup.js"></script>
  </body>
</html>
